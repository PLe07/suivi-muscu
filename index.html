<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi muscu</title>
<meta name="description" content="Programme pecs et bras de Léopold : séances du jour, chrono, vidéos, pas et progrès.">
<meta name="theme-color" content="#2C43CF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Suivi muscu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout : une colonne mobile, en-tête collant, barre de chrono et onglets en bas */
  --bg:#EDEFF4;
  --surface:#FFFFFF;
  --ink:#131A2C;
  --muted:#5A6378;
  --line:#D7DBE5;
  --accent:#2C43CF;
  --accent-ink:#FFFFFF;
  --accent-soft:#E2E6FB;
  --good:#1B7C47;
  --good-soft:#DCF1E4;
  --warn:#9E5B00;
  --warn-soft:#FAEBD3;
  --crit:#B3312A;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1120; --surface:#161B2D; --ink:#E7EAF4; --muted:#9BA3B9; --line:#2A3148;
    --accent:#8090FF; --accent-ink:#0D1120; --accent-soft:#222A50;
    --good:#5CCB8B; --good-soft:#163426; --warn:#F0AE4C; --warn-soft:#3A2B12; --crit:#FF7B71;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1120; --surface:#161B2D; --ink:#E7EAF4; --muted:#9BA3B9; --line:#2A3148;
  --accent:#8090FF; --accent-ink:#0D1120; --accent-soft:#222A50;
  --good:#5CCB8B; --good-soft:#163426; --warn:#F0AE4C; --warn-soft:#3A2B12; --crit:#FF7B71;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(150px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1}
.week-tag{font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--accent);letter-spacing:.05em;text-transform:uppercase;margin-top:5px}
.status{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap;cursor:pointer}
.status.ok::before,.status.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px}
.status.sync::before{background:var(--warn)}
.status.err{color:var(--crit);border-color:var(--crit)}
.status.local{color:var(--warn);border-color:var(--warn)}
h2{font-family:var(--font-display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:26px 0 10px;text-wrap:balance}
h3{font-family:var(--font-display);font-size:20px;font-weight:700;margin:0;letter-spacing:.02em;line-height:1.15;text-wrap:balance}
h3 .sous{font-weight:500;color:var(--muted)}
p{margin:0}
.date{font-family:var(--font-display);font-size:30px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin:18px 0 12px;line-height:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card.main{border-left:5px solid var(--accent)}
.card.isdone{border-left:5px solid var(--good)}
.card.hint{border-left:5px solid var(--warn)}
.stack{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.mt{margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{display:inline-block;text-decoration:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 16px;font-weight:700;font-size:15.5px;text-align:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.sm{padding:6px 11px;font-size:14px;border-radius:8px}
.btn.quiet{border-color:var(--line);background:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.chip:focus-visible,nav.tabs a:focus-visible,summary:focus-visible,.status:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tip{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:14.5px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:14.5px;font-weight:600}
details.warm{border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
details.warm summary{font-weight:700;cursor:pointer}
details.warm ul{margin:8px 0 2px;padding-left:20px}
.ex{border-top:1px solid var(--line);padding:12px 0 10px;display:grid;gap:8px}
.ex:first-of-type{border-top:0}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex-name{font-weight:700;font-size:16.5px}
.ex-detail{font-weight:400;color:var(--muted);font-size:14px}
.ex-target{font-family:var(--font-display);font-size:19px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.ex-c{font-size:14px;color:var(--muted)}
.sets{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.sets input{width:60px;padding:8px 4px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:17px;font-family:var(--font-body);font-variant-numeric:tabular-nums}
.sets .lbl{font-size:12px;color:var(--muted);display:block;text-align:center;margin-bottom:2px}
.last{font-size:13px;color:var(--muted)}
.up{font-size:13px;font-weight:700;color:var(--good)}
.vid{border-radius:12px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.vid video{display:block;width:100%;max-height:340px;background:#000}
.vid .vfoot{padding:8px 10px;font-size:13.5px}
textarea,label.f input,label.f select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:64px;resize:vertical}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.day{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.day:first-of-type{border-top:0}
.dname{font-family:var(--font-display);font-weight:700;font-size:19px;text-transform:uppercase;line-height:1.05}
.day.today .dname{color:var(--accent)}
.ddate{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:34px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.chip.push{border-color:var(--accent);color:var(--accent)}
.chip.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.add{border-style:dashed;color:var(--muted);font-weight:600}
.rest-day{font-size:14px;color:var(--muted)}
.menu{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--accent-soft);border-radius:10px;align-items:center}
.menu .lab{font-size:13px;font-weight:700;margin-right:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 13px;color:var(--muted);font-weight:700;font-size:14.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 10px}
.nav-arrow{font-size:24px;line-height:1;padding:6px 14px;flex:none}
.weeknav .t{font-family:var(--font-display);font-size:21px;font-weight:700;text-transform:uppercase;text-align:center;line-height:1.1}
.weeknav .t small{display:block;font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--muted);text-transform:none}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile .big{font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:5px;font-weight:700}
.bigsteps{font-family:var(--font-display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;min-width:70px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.ok > i{background:var(--good)}
.rating{display:flex;gap:6px}
.rating button{width:42px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:700}
.rating button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.todo{display:grid;gap:8px;margin-top:8px}
.todo label,.toggle{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.todo input,.toggle input{width:20px;height:20px;margin-top:1px;accent-color:var(--good);flex:none}
.todo input:checked + span{color:var(--muted);text-decoration:line-through}
ul.plain{margin:6px 0 0;padding-left:20px}
ul.plain li{margin:3px 0}
ol.rules{margin:6px 0 0;padding-left:22px}
ol.rules li{margin:6px 0}
code{font-size:13.5px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;word-break:break-all}
.chart svg{width:100%;height:auto;display:block}
.runbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:11;display:flex;justify-content:center;pointer-events:none;padding:0 12px}
.runbar[hidden]{display:none}
.runbar .in{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:736px;width:100%}
.runbar .t{font-family:var(--font-display);font-variant-numeric:tabular-nums;line-height:1}
.runbar .t b{display:block;font-size:26px}
.runbar .t span{font-size:13px;font-family:var(--font-body);opacity:.75;font-weight:600}
.runbar .cd{margin-left:auto;text-align:right}
.runbar .cd.hold b{color:#F0AE4C}
.runbar .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:760px;margin:0 auto;gap:4px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:700;border-radius:10px}
nav.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <div>
      <h1>Suivi Léopold</h1>
      <div class="week-tag" id="weektag">Programme pecs &amp; bras</div>
    </div>
    <button type="button" id="status" class="status">Local</button>
  </div>
</header>
<main class="wrap" id="app"></main>
<div class="runbar" id="runbar" hidden>
  <div class="in">
    <div class="t" id="run-el"><b id="run-time">0:00</b><span id="run-lbl">Séance</span></div>
    <div class="t cd" id="cd" hidden><b id="cd-time">1:30</b><span id="cd-lbl">Repos</span></div>
    <button type="button" class="btn sm" id="cd-stop" hidden>Stop</button>
  </div>
</div>
<nav class="tabs" aria-label="Sections">
  <div class="in">
    <a href="#aujourdhui" data-v="aujourdhui"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Aujourd'hui</a>
    <a href="#semaine" data-v="semaine"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Semaine</a>
    <a href="#seances" data-v="seances"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>Séances</a>
    <a href="#progres" data-v="progres"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h18M5 16l5-5 4 3 6-7"/></svg>Progrès</a>
    <a href="#plus" data-v="plus"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Plus</a>
  </div>
</nav>
<script src="app.js" defer></script>
</body>
</html>
