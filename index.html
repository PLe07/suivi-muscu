<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Suivi muscu</title>
<meta name="description" content="Programme pecs et bras de Léopold : séances du jour, chrono, vidéos, pas et progrès.">
<meta name="theme-color" content="#2C43CF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Suivi muscu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* Layout : une colonne mobile, en-tête collant, barre de chrono et onglets en bas */
  --bg:#EDEFF4;
  --surface:#FFFFFF;
  --ink:#131A2C;
  --muted:#5A6378;
  --line:#D7DBE5;
  --accent:#2C43CF;
  --accent-ink:#FFFFFF;
  --accent-soft:#E2E6FB;
  --good:#1B7C47;
  --good-soft:#DCF1E4;
  --warn:#9E5B00;
  --warn-soft:#FAEBD3;
  --crit:#B3312A;
  --font-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --font-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1120; --surface:#161B2D; --ink:#E7EAF4; --muted:#9BA3B9; --line:#2A3148;
    --accent:#8090FF; --accent-ink:#0D1120; --accent-soft:#222A50;
    --good:#5CCB8B; --good-soft:#163426; --warn:#F0AE4C; --warn-soft:#3A2B12; --crit:#FF7B71;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1120; --surface:#161B2D; --ink:#E7EAF4; --muted:#9BA3B9; --line:#2A3148;
  --accent:#8090FF; --accent-ink:#0D1120; --accent-soft:#222A50;
  --good:#5CCB8B; --good-soft:#163426; --warn:#F0AE4C; --warn-soft:#3A2B12; --crit:#FF7B71;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:0 16px calc(150px + env(safe-area-inset-bottom))}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:760px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
h1{font-family:var(--font-display);font-weight:700;font-size:26px;letter-spacing:.03em;text-transform:uppercase;margin:0;line-height:1}
.week-tag{font-family:var(--font-display);font-size:15px;font-weight:600;color:var(--accent);letter-spacing:.05em;text-transform:uppercase;margin-top:5px}
.status{font-size:12.5px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap;cursor:pointer}
.status.ok::before,.status.sync::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--good);margin-right:6px;vertical-align:1px}
.status.sync::before{background:var(--warn)}
.status.err{color:var(--crit);border-color:var(--crit)}
.status.local{color:var(--warn);border-color:var(--warn)}
h2{font-family:var(--font-display);font-size:22px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;margin:26px 0 10px;text-wrap:balance}
h3{font-family:var(--font-display);font-size:20px;font-weight:700;margin:0;letter-spacing:.02em;line-height:1.15;text-wrap:balance}
h3 .sous{font-weight:500;color:var(--muted)}
p{margin:0}
.date{font-family:var(--font-display);font-size:30px;font-weight:700;text-transform:uppercase;letter-spacing:.02em;margin:18px 0 12px;line-height:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.card.main{border-left:5px solid var(--accent)}
.card.isdone{border-left:5px solid var(--good)}
.card.hint{border-left:5px solid var(--warn)}
.stack{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.mt{margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
button{font:inherit;cursor:pointer;color:inherit}
.btn{display:inline-block;text-decoration:none;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:10px 16px;font-weight:700;font-size:15.5px;text-align:center}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.good{background:var(--good);border-color:var(--good);color:var(--surface)}
.btn.sm{padding:6px 11px;font-size:14px;border-radius:8px}
.btn.quiet{border-color:var(--line);background:transparent;color:var(--muted)}
.btn:disabled{opacity:.5;cursor:default}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,.chip:focus-visible,nav.tabs a:focus-visible,summary:focus-visible,.status:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.tip{background:var(--accent-soft);color:var(--ink);border-radius:10px;padding:9px 12px;font-size:14.5px}
.warnbox{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:9px 12px;font-size:14.5px;font-weight:600}
details.warm{border:1px dashed var(--line);border-radius:10px;padding:8px 12px}
details.warm summary{font-weight:700;cursor:pointer}
details.warm ul{margin:8px 0 2px;padding-left:20px}
.ex{border-top:1px solid var(--line);padding:12px 0 10px;display:grid;gap:8px}
.ex:first-of-type{border-top:0}
.ex-head{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.ex-name{font-weight:700;font-size:16.5px}
.ex-detail{font-weight:400;color:var(--muted);font-size:14px}
.ex-target{font-family:var(--font-display);font-size:19px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.ex-c{font-size:14px;color:var(--muted)}
.sets{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.sets input{width:60px;padding:8px 4px;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font-size:17px;font-family:var(--font-body);font-variant-numeric:tabular-nums}
.sets .lbl{font-size:12px;color:var(--muted);display:block;text-align:center;margin-bottom:2px}
.last{font-size:13px;color:var(--muted)}
.up{font-size:13px;font-weight:700;color:var(--good)}
.vid{border-radius:12px;overflow:hidden;background:var(--bg);border:1px solid var(--line)}
.vid video{display:block;width:100%;max-height:340px;background:#000}
.vid .vfoot{padding:8px 10px;font-size:13.5px}
textarea,label.f input,label.f select{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%}
textarea{min-height:64px;resize:vertical}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);font-weight:700}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{text-align:left;font-weight:700;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{overflow-x:auto}
.day{display:grid;grid-template-columns:76px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line);align-items:start}
.day:first-of-type{border-top:0}
.dname{font-family:var(--font-display);font-weight:700;font-size:19px;text-transform:uppercase;line-height:1.05}
.day.today .dname{color:var(--accent)}
.ddate{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:34px}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700}
.chip.push{border-color:var(--accent);color:var(--accent)}
.chip.done{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.chip.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.add{border-style:dashed;color:var(--muted);font-weight:600}
.rest-day{font-size:14px;color:var(--muted)}
.menu{grid-column:1 / -1;display:flex;flex-wrap:wrap;gap:6px;padding:10px;background:var(--accent-soft);border-radius:10px;align-items:center}
.menu .lab{font-size:13px;font-weight:700;margin-right:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;padding:8px 13px;color:var(--muted);font-weight:700;font-size:14.5px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:18px 0 10px}
.nav-arrow{font-size:24px;line-height:1;padding:6px 14px;flex:none}
.weeknav .t{font-family:var(--font-display);font-size:21px;font-weight:700;text-transform:uppercase;text-align:center;line-height:1.1}
.weeknav .t small{display:block;font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--muted);text-transform:none}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile .big{font-family:var(--font-display);font-size:32px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.tile .lbl{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:5px;font-weight:700}
.bigsteps{font-family:var(--font-display);font-size:40px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.bar{height:7px;background:var(--line);border-radius:4px;overflow:hidden;min-width:70px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar.ok > i{background:var(--good)}
.rating{display:flex;gap:6px}
.rating button{width:42px;height:40px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-weight:700}
.rating button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.todo{display:grid;gap:8px;margin-top:8px}
.todo label,.toggle{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.todo input,.toggle input{width:20px;height:20px;margin-top:1px;accent-color:var(--good);flex:none}
.todo input:checked + span{color:var(--muted);text-decoration:line-through}
ul.plain{margin:6px 0 0;padding-left:20px}
ul.plain li{margin:3px 0}
ol.rules{margin:6px 0 0;padding-left:22px}
ol.rules li{margin:6px 0}
code{font-size:13.5px;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:1px 5px;word-break:break-all}
.chart svg{width:100%;height:auto;display:block}
.runbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom));z-index:11;display:flex;justify-content:center;pointer-events:none;padding:0 12px}
.runbar[hidden]{display:none}
.runbar .in{pointer-events:auto;background:var(--ink);color:var(--bg);border-radius:16px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 24px rgba(0,0,0,.28);max-width:736px;width:100%}
.runbar .t{font-family:var(--font-display);font-variant-numeric:tabular-nums;line-height:1}
.runbar .t b{display:block;font-size:26px}
.runbar .t span{font-size:13px;font-family:var(--font-body);opacity:.75;font-weight:600}
.runbar .cd{margin-left:auto;text-align:right}
.runbar .cd.hold b{color:#F0AE4C}
.runbar .btn{background:var(--bg);color:var(--ink);border-color:var(--bg)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:760px;margin:0 auto;gap:4px}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:700;border-radius:10px}
nav.tabs a[aria-current="page"]{color:var(--accent);background:var(--accent-soft)}
nav.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* Accueil */
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-top:16px}
.hello .date{margin:0 0 6px}
.motiv{font-size:14.5px;color:var(--muted);max-width:46ch}
.streak{flex:none;display:grid;justify-items:center;background:var(--warn-soft);color:var(--warn);border-radius:14px;padding:8px 12px;line-height:1.1}
.streak b{font-family:var(--font-display);font-size:24px}
.streak span{font-size:12px;font-weight:700}
.streak.zero{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.wstrip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:14px;text-decoration:none;color:inherit}
.wd{display:grid;justify-items:center;gap:3px;padding:7px 0 8px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.wd small{font-size:11px;font-weight:700;color:var(--muted)}
.wd b{font-family:var(--font-display);font-size:17px;min-height:20px;line-height:20px}
.wd.plan b{color:var(--accent)}
.wd.cardio b{color:var(--muted)}
.wd.done{background:var(--good-soft);border-color:var(--good)}
.wd.done b{color:var(--good)}
.wd.part{border-color:var(--good)}
.wd.miss{background:var(--warn-soft);border-color:var(--warn)}
.wd.miss b{color:var(--warn)}
.wd.now{outline:2px solid var(--accent);outline-offset:1px}
.card.hero{padding:18px;border-left:5px solid var(--accent)}
.card.hero.isdone{border-left-color:var(--good)}
.kicker{font-family:var(--font-display);font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin-bottom:4px}
.kicker.good{color:var(--good)}
.hero-t{font-size:26px}
.ex-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ex-chips span{font-size:12.5px;font-weight:600;padding:3px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.btn.big{width:100%;padding:15px 18px;font-size:18px;border-radius:14px}
.mini-stats{display:flex;flex-wrap:wrap;gap:14px;margin-top:8px;font-size:14px;color:var(--muted)}
.mini-stats b{font-family:var(--font-display);font-size:22px;color:var(--ink)}
.card.slim{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 16px;font-size:15px}
details.card summary{cursor:pointer}
/* Progrès */
.heat{display:grid;gap:4px}
.heat-h,.heat-r{display:grid;grid-template-columns:34px repeat(7,1fr);gap:4px;align-items:center}
.heat-h span{font-size:11px;font-weight:700;color:var(--muted);text-align:center}
.heat-w{font-size:11px;font-weight:700;color:var(--muted)}
.hc{display:block;height:18px;border-radius:5px;background:var(--bg);border:1px solid var(--line)}
.hc.done{background:var(--good);border-color:var(--good)}
.hc.cardio{background:var(--good-soft);border-color:var(--good)}
.hc.miss{background:var(--warn-soft);border-color:var(--warn)}
.hc.todo{background:var(--accent-soft);border-color:var(--accent)}
.hc.now{outline:2px solid var(--ink);outline-offset:1px}
.heat-leg{display:flex;flex-wrap:wrap;gap:12px;margin-top:10px;font-size:12.5px;color:var(--muted)}
.heat-leg span{display:inline-flex;align-items:center;gap:5px}
.heat-leg .hc{width:14px;height:14px;display:inline-block}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.badge{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 8px;display:grid;justify-items:center;text-align:center;gap:2px;opacity:.55}
.badge.on{opacity:1;border-color:var(--good);background:var(--good-soft)}
.badge .bi{font-size:26px;filter:grayscale(1)}
.badge.on .bi{filter:none}
.badge b{font-size:13px;line-height:1.2}
.badge small{font-size:11.5px;color:var(--muted)}
.vbars{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px;align-items:end;height:150px;margin-top:10px}
.vb{display:grid;grid-template-rows:auto 1fr auto;justify-items:center;height:100%;gap:3px}
.vb i{align-self:end;width:70%;background:var(--accent);border-radius:6px 6px 2px 2px;display:block}
.vb-n{font-size:11.5px;font-weight:700;font-variant-numeric:tabular-nums}
.vb-l{font-size:11px;color:var(--muted);font-weight:700}
/* Mode séance guidé */
.play{position:fixed;inset:0;z-index:30;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.play[hidden]{display:none}
.p-top{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 16px 8px;max-width:640px;margin:0 auto}
.p-x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:18px;flex:none}
.p-title{flex:1;display:grid;line-height:1.15}
.p-title b{font-family:var(--font-display);font-size:18px;text-transform:uppercase;letter-spacing:.03em}
.p-title span{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.p-count{font-family:var(--font-display);font-size:20px;font-weight:700;color:var(--accent)}
.p-prog{height:5px;background:var(--line);max-width:640px;margin:0 auto}
.p-prog i{display:block;height:100%;background:var(--good);transition:width .3s}
.p-body{max-width:640px;margin:0 auto;padding:14px 16px 40px;display:grid;gap:10px}
.p-kicker{font-family:var(--font-display);font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:0}
.p-h{margin:0;font-size:28px;line-height:1.05}
.p-det{font-family:var(--font-body);font-size:15px;font-weight:500;color:var(--muted);text-transform:none;letter-spacing:0}
.p-target{font-size:15.5px;font-weight:600}
.p-cue{font-size:14.5px;color:var(--muted)}
.p-unit{text-align:center;font-size:14px;color:var(--muted);margin-top:-4px}
.p-flash{text-align:center;font-weight:700;color:var(--good);background:var(--good-soft);border-radius:12px;padding:10px}
.p-next{text-align:center;font-size:15px}
.pvid{border-radius:16px;overflow:hidden;background:#000;aspect-ratio:16/9}
.pvid video{width:100%;height:100%;object-fit:cover;display:block}
.pvid-yt{display:grid;place-items:center;height:100%;color:#fff;font-weight:700;text-decoration:none;background:linear-gradient(135deg,#1c2340,#2C43CF)}
.stepper{display:grid;grid-template-columns:76px 1fr 76px;align-items:center;gap:10px;margin-top:6px}
.stepper button{height:76px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-size:36px;font-weight:700;color:var(--accent)}
.stepper button:active{transform:scale(.96)}
.stepper output{text-align:center;font-family:var(--font-display);font-size:72px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums}
.p-actions{display:grid;gap:10px;margin-top:6px}
.p-mini{display:flex;justify-content:space-between;gap:10px}
.p-mini button{border:0;background:none;color:var(--muted);font-weight:600;font-size:14px;padding:8px 0}
.p-warm{display:grid;gap:8px}
.p-wi{display:flex;align-items:center;gap:12px;text-align:left;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);font-size:16px;font-weight:600}
.p-wi.on{border-color:var(--good);background:var(--good-soft)}
.p-chk{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex:none;color:var(--good);font-weight:700}
.p-wi.on .p-chk{border-color:var(--good);background:var(--surface)}
.p-ring{position:relative;width:min(70vw,260px);aspect-ratio:1;margin:8px auto}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:var(--line);stroke-width:14}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:14;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.p-ring.hold .ring-fg{stroke:var(--warn)}
.ring-txt{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring-txt b{font-family:var(--font-display);font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.ring-txt span{font-size:14px;color:var(--muted);font-weight:700}
.p-sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.p-sum div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center;display:grid}
.p-sum b{font-family:var(--font-display);font-size:34px;line-height:1}
.p-sum span{font-size:12.5px;color:var(--muted);font-weight:700}
.p-prs{display:grid;gap:6px;background:var(--good-soft);border-radius:14px;padding:12px;color:var(--good)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:40;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(540deg);opacity:.7}}
.runbar .in{cursor:pointer}
/* Traceur GPS */
.trk{z-index:31}
.t-body{gap:12px}
.t-mapbox{position:relative;z-index:0;isolation:isolate;border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.t-map{height:min(40vh,360px);width:100%;background:var(--accent-soft)}
.t-nomap{display:grid;place-items:center;height:100%;margin:0;padding:16px;text-align:center;color:var(--muted);font-size:14px}
.t-recenter{position:absolute;right:10px;bottom:10px;z-index:500;box-shadow:0 4px 12px rgba(0,0,0,.2)}
.t-big{display:flex;align-items:baseline;justify-content:center;gap:8px;margin-top:2px}
.t-big b{font-family:var(--font-display);font-size:80px;line-height:.95;font-variant-numeric:tabular-nums}
.t-big span{font-family:var(--font-display);font-size:26px;font-weight:700;color:var(--muted)}
.t-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.t-grid div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 4px;text-align:center;display:grid;gap:3px}
.t-grid b{font-family:var(--font-display);font-size:23px;line-height:1.05;font-variant-numeric:tabular-nums}
.t-grid span{font-size:12px;color:var(--muted);font-weight:700}
.t-msg{text-align:center;font-size:14px;color:var(--warn);font-weight:600}
.t-msg:empty{display:none}
.t-gps{font-size:12.5px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.t-gps.ok{color:var(--good);border-color:var(--good)}
.t-gps.mid{color:var(--warn);border-color:var(--warn)}
.t-gps.bad{color:var(--crit);border-color:var(--crit)}
.t-actions{grid-template-columns:1fr 1fr}
.t-lock{position:fixed;inset:0;z-index:60;background:#000;color:#8a90a0;display:grid;place-content:center;justify-items:center;gap:6px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;text-align:center;padding:24px}
.t-lock[hidden]{display:none}
.t-lock b{font-family:var(--font-display);font-size:68px;line-height:1;color:#c9ced8;font-variant-numeric:tabular-nums}
.t-lock span{font-family:var(--font-display);font-size:30px;font-variant-numeric:tabular-nums}
.t-lock p{font-size:14px;margin-top:28px;color:#5d6373;transition:color .9s}
.t-lock.hold p{color:#e7eaf4}
.bigkm{font-family:var(--font-display);font-size:30px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;margin-left:10px}
.sortie{display:flex;gap:12px;align-items:center;padding:9px 0}
.sortie + .sortie{border-top:1px solid var(--line)}
.sortie > div{flex:1;display:grid;gap:1px;min-width:0}
.trace{width:72px;height:54px;flex:none;background:var(--bg);border-radius:9px;border:1px solid var(--line)}
.trace path{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.trace .tr-a{fill:var(--good)}
.trace .tr-b{fill:var(--accent)}
.vb-st{align-self:end;width:70%;display:flex;flex-direction:column;border-radius:6px 6px 2px 2px;overflow:hidden}
.vb-st i{display:block;width:100%;min-height:0;border-radius:0}
.vb-st i.bk,.lg.bk{background:var(--accent)}
.vb-st i.wk,.lg.wk{background:var(--good)}
.lg{display:inline-block;width:12px;height:12px;border-radius:3px}
.runbar #trk-el b{font-size:22px}
.leaflet-container{font-family:var(--font-body)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>

  <div class="top-in">
    <div>
      <h1>Suivi Léopold</h1>
      <div class="week-tag" id="weektag">Programme pecs &amp; bras</div>
    </div>

    <div class="t" id="trk-el" hidden><b id="trk-km">0,00 km</b><span id="trk-lbl">Sortie GPS</span></div>
    <div class="t cd" id="cd" hidden><b id="cd-time">1:30</b><span id="cd-lbl">Repos</span></div>
    <button type="button" class="btn sm" id="cd-stop" hidden>Stop</button>

</div>
